<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ringside — call</title><link rel="stylesheet" href="/static/coach.css">
<style>
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}
  .top h1{font:300 30px/1.1 var(--serif);margin:4px 0 0}
  .layout{display:grid;grid-template-columns:1fr;gap:14px}
  #pre .brief{font:300 22px/1.4 var(--serif);color:var(--ink);margin:10px 0 16px}
  #pre .avoid{color:var(--stop)}
  .live{display:grid;gap:14px}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:16px}
  .who{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:12px}
  .who b{color:var(--ink2);font-weight:500}
  #events{color:var(--muted);font-size:12px;min-height:16px}
</style></head><body><div class="wrap">
<div class="top">
  <div><div class="brand">Ring<b>side</b> <span class="muted" style="letter-spacing:.1em;text-transform:none">· the coach in your corner</span></div><h1 id="company">…</h1><div class="muted" id="sub"></div></div>
  <div style="text-align:right"><div class="timer" id="timer">0:00</div><div class="muted" id="mode"></div></div>
</div>

<div id="pre" class="panel" hidden>
  <div class="kicker">Before you dial</div>
  <div class="brief" id="brief"></div>
  <div id="dnc" class="banner" hidden>Do not call — they asked to be removed. This call will not start.</div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="start">Start call</button>
    <button class="btn ghost" id="startScripted" hidden>Play scripted call (no mic)</button>
    <span class="muted" id="avoidNote"></span>
  </div>
</div>

<div id="live" class="live" hidden>
  <div class="stages" id="stages"></div>
  <div class="cue silent" id="cue"><div class="lab">listening</div><div class="line">· · ·</div></div>
  <div class="dials">
    <div class="dial"><div class="k">Talking to</div><div class="v" id="role">—</div></div>
    <div class="dial"><div class="k">Momentum</div><div class="mom" id="mom"></div></div>
    <div class="dial"><div class="k">Your share of talk <span id="talkv" class="ink2"></span></div><div class="talk" id="talk"></div></div>
    <div class="dial"><div class="k">Known facts</div><div class="v" id="facts" style="font-size:15px;font-family:var(--mono);color:var(--ink2);margin-top:8px">—</div></div>
  </div>
  <div class="panel"><div class="row" style="justify-content:space-between"><div class="kicker">Transcript</div><div id="events"></div></div><div class="transcript" id="transcript"></div></div>
  <div class="foot">
    <div class="who"><span>mic</span><div class="level"><i id="lvl"></i></div><span id="peer"></span><a href="#" id="popout">pop-out overlay ↗</a></div>
    <button class="btn danger" id="end">End call</button>
  </div>
</div>

<div id="debrief" hidden></div>
<div class="row" style="margin-top:18px"><a href="/">← accounts</a><a href="/insights">insights</a><span class="muted" id="foot"></span></div>
</div>
<script src="/static/coach.js"></script>
<script>
const callId = location.pathname.split("/").pop();
let ws, player, mic, hello, started = null, ended = false, timerIv;
const els = {stages: $("stages"), role: $("role"), mom: $("mom"), talk: $("talk"), talkv: $("talkv"), facts: $("facts")};
function tick(){ if (started && !ended) $("timer").textContent = fmtT((Date.now() - started) / 1000); }
function show(id, on){ $(id).hidden = !on; }
function connect(){
  ws = new WebSocket(wsUrl(`/ws/seat/${callId}/broker`)); ws.binaryType = "arraybuffer";
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) { if (player) player.play(e.data); return; }
    const m = JSON.parse(e.data);
    if (m.type === "hello") { hello = m; player = new Player(m.out_rate); started = Date.now(); timerIv = setInterval(tick, 500); renderState(m.state, els); $("mode").textContent = m.mode + " prospect"; if (m.mode === "human") $("peer").innerHTML = `judge seat: <a href="/prospect/${callId}" target="_blank">/prospect/${callId}</a>`; if (m.mode === "phone") $("peer").textContent = "waiting for the phone to connect…"; }
    else if (m.type === "cue") { if (m.kind === "info") return; renderCue($("cue"), m); }
    else if (m.type === "state") renderState(m, els);
    else if (m.type === "transcript") addTranscript($("transcript"), m, false);
    else if (m.type === "partial") addTranscript($("transcript"), m, true);
    else if (m.type === "event") { const k = m.kind; const txt = {ringing: "transferring… ringing", picked_up: "decision maker picked up", transfer: "gatekeeper is transferring you", prospect_hangup: "the prospect hung up", seat_joined: m.seat === "prospect" ? "judge seat connected" : "", seat_left: m.seat === "prospect" ? "judge seat left" : "", phone_connected: "phone connected", stt_ready: "local speech recognition ready"}[k]; if (txt) $("events").textContent = txt; if (k === "picked_up" || k === "transfer") { if (player) player.clear(); } }
    else if (m.type === "ended") finish(m.debrief, true);
    else if (m.type === "debrief") finish(m.debrief, false);
  };
  ws.onclose = () => { if (!ended) $("events").textContent = "connection closed"; };
}
function finish(d, pending){ ended = true; clearInterval(timerIv); show("live", false); show("debrief", true); renderDebrief($("debrief"), d, {pending: pending && d.source !== "llm"}); if (mic) { mic.stop(); mic = null; } }
async function start(){
  show("pre", false); show("live", true); renderCue($("cue"), null);
  connect();
  try { mic = await startMic((pcm) => { if (ws && ws.readyState === 1) ws.send(pcm); }, (p) => { $("lvl").style.width = Math.min(100, Math.round(p * 300)) + "%"; }); }
  catch (e) { $("events").textContent = "microphone blocked: " + e.message; }
}
$("start").onclick = start;
$("startScripted").onclick = async () => { show("pre", false); show("live", true); renderCue($("cue"), null); ws = new WebSocket(wsUrl(`/ws/events/${callId}`)); const w = ws; w.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === "hello") { hello = m; started = Date.now(); timerIv = setInterval(tick, 500); renderState(m.state, els); $("mode").textContent = "scripted"; } else if (m.type === "cue") { if (m.kind !== "info") renderCue($("cue"), m); } else if (m.type === "state") renderState(m, els); else if (m.type === "transcript") addTranscript($("transcript"), m, false); else if (m.type === "ended") finish(m.debrief, true); else if (m.type === "debrief") finish(m.debrief, false); }; await fetch(`/api/calls/${callId}/script`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: new URLSearchParams(location.search).get("script") || "brooklyn_auto"})}); };
$("end").onclick = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: "hangup"})); if (mic) { mic.stop(); mic = null; } };
$("popout").onclick = (e) => { e.preventDefault(); window.open(`/overlay/${callId}`, "ringside-overlay", "width=720,height=260,alwaysOnTop=yes"); };
(async () => {
  const r = await fetch(`/api/calls/${callId}`); if (!r.ok) { $("company").textContent = "no such call"; return; }
  const c = await r.json();
  $("company").textContent = c.account.company; $("sub").textContent = `${c.account.industry || ""} · ${c.broker.name}, ${c.broker.agency}`;
  $("brief").textContent = c.brief.text; $("avoidNote").textContent = c.brief.avoid.length ? `${c.brief.avoid.length} line${c.brief.avoid.length > 1 ? "s" : ""} that failed last time are benched` : "";
  $("mode").textContent = c.mode; $("foot").textContent = `call ${callId}`;
  if (c.ended) { finish(c.debrief, false); return; }
  if (c.mode === "scripted") { $("start").hidden = true; $("startScripted").hidden = false; }
  if (c.mode === "human") { const u = c.judge_urls || {}; $("avoidNote").innerHTML = `judge opens <b class="ink2">${esc(u.public || u.lan)}</b>${u.public ? "" : " <span class='muted'>(phones need https — run ./run.sh --public)</span>"}`; }
  if (c.do_not_call) { $("dnc").hidden = false; $("start").disabled = true; $("startScripted").disabled = true; }
  show("pre", true);
})();
</script></body></html>
